name = "fufut-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Bindings and cron mirror the deployed Worker exactly, read from the live
# script on 2026-08-08. Changing any id repoints production data.

[[d1_databases]]
binding = "DB"
database_name = "fufut-db"
database_id = "9baede26-e135-4f8d-bcbe-43751290dbb5"

[[r2_buckets]]
binding = "IMAGES_R2"
bucket_name = "fufut-images"

[[kv_namespaces]]
binding = "CONTENT_KV"
id = "d591041eadfe4b69bbdd608e706c7f88"

[[kv_namespaces]]
binding = "MENU_KV"
id = "72ed1b11297048a4b17f702091c06baa"

[[kv_namespaces]]
binding = "ORDERS_KV"
id = "3d1056ebcd05439e911585c6f942fafa"

[[kv_namespaces]]
binding = "RESERVATIONS_KV"
id = "686a682f961c45a9882b407f84e71b62"

[[kv_namespaces]]
binding = "REVIEWS_KV"
id = "d2bf07f27482429aa3482d31527c1f6c"

[[kv_namespaces]]
binding = "GALLERY_KV"
id = "8a05f5eecd7e477b92825d22df3ee67c"

# Matches the deployed schedule (every minute) — checkScheduledPublish().
[triggers]
crons = ["* * * * *"]

# ── Sync (stages 4-5) ────────────────────────────────────────────────────────
# Deliberately commented out. Setting SITE_ID switches on outbox capture for
# every write in production, so turning sync on is a decision with a date on it,
# not something that rides along with an unrelated deploy.
#
# Before uncommenting:
#   1. npx wrangler d1 execute fufut-db --remote --file migrations/014-sync.sql
#      (capture is fail-open, so without the tables every write logs an error
#      and nothing syncs — the till keeps working, which is the point, but it is
#      not a state to deploy into deliberately)
#   2. npx wrangler secret put SYNC_TOKEN
#      The same value goes in the box's docker-compose.yml. Without it the
#      /api/sync/* machine routes return 404 and do not exist.
#
# [vars]
# SITE_ID = "cloud"

# ── Rehearsal environment ────────────────────────────────────────────────────
# `wrangler deploy --env rehearsal` puts the Worker on its OWN D1 database.
#
# This exists because the `fufut-api-staging` deploy in CI shares production's
# D1/KV/R2 — deliberately, so it exercises real data — which makes it exactly
# the wrong place to rehearse sync. A sync rehearsal pushes entries and creates
# rows; doing that against the production database is not a rehearsal, it is a
# write to the business's records.
#
# Bindings are not inherited by named environments, so everything is repeated.
# KV and R2 point at the production namespaces on purpose: the sync routes never
# touch either, and creating six throwaway namespaces to prove that would be
# more moving parts, not fewer.
#
# BETWEEN REHEARSALS THE WORKER DOES NOT EXIST. It is deleted once a rehearsal
# finishes, so nothing is left publicly reachable running a cron against a
# half-real database. The D1 database below persists — it is cheap, it holds
# only test data, and keeping it means the next rehearsal starts from a schema
# that is already correct.
#
# To rehearse again:
#   npx wrangler secret put SYNC_TOKEN --env rehearsal   # the old one died with the Worker
#   npx wrangler deploy --env rehearsal
#
# And delete the Worker again afterwards:
#   npx wrangler delete --name fufut-api-rehearsal
[env.rehearsal]
vars = { SITE_ID = "cloud" }

[[env.rehearsal.d1_databases]]
binding = "DB"
database_name = "fufut-db-staging"
database_id = "a7e16cd6-8f14-4dd3-9b8b-6b119b18421f"

[[env.rehearsal.r2_buckets]]
binding = "IMAGES_R2"
bucket_name = "fufut-images"

[[env.rehearsal.kv_namespaces]]
binding = "CONTENT_KV"
id = "d591041eadfe4b69bbdd608e706c7f88"

[[env.rehearsal.kv_namespaces]]
binding = "MENU_KV"
id = "72ed1b11297048a4b17f702091c06baa"

[[env.rehearsal.kv_namespaces]]
binding = "ORDERS_KV"
id = "3d1056ebcd05439e911585c6f942fafa"

[[env.rehearsal.kv_namespaces]]
binding = "RESERVATIONS_KV"
id = "686a682f961c45a9882b407f84e71b62"

[[env.rehearsal.kv_namespaces]]
binding = "REVIEWS_KV"
id = "d2bf07f27482429aa3482d31527c1f6c"

[[env.rehearsal.kv_namespaces]]
binding = "GALLERY_KV"
id = "8a05f5eecd7e477b92825d22df3ee67c"
